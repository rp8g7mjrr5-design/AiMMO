name: Set up Godot
description: Installs the pinned Godot version (and optionally export templates), cached.
inputs:
  version:
    description: Godot version tag
    default: 4.3-stable
  templates:
    description: Also install export templates (about 1 GB)
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot-bin
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.version }}-templates-${{ inputs.templates }}
    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        V="${{ inputs.version }}"
        mkdir -p ~/godot-bin
        curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot-bin
        mv ~/godot-bin/Godot_v${V}_linux.x86_64 ~/godot-bin/godot
        if [ "${{ inputs.templates }}" = "true" ]; then
          D=~/.local/share/godot/export_templates/${V/-/.}
          mkdir -p "$D"
          curl -fsSL -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz 'templates/linux_*x86_64*' 'templates/windows_*x86_64*' 'templates/macos.zip' 'templates/version.txt' -d /tmp/tpl
          mv /tmp/tpl/templates/* "$D/"
          rm /tmp/tpl.tpz
        fi
    - name: Put Godot on PATH
      shell: bash
      run: |
        echo "$HOME/godot-bin" >> "$GITHUB_PATH"
        "$HOME/godot-bin/godot" --version
    - name: Import project (builds the script class cache)
      shell: bash
      run: godot --headless --path game --import >/dev/null 2>&1 || true
