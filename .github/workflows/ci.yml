name: CI

# Every PR and every push to main: unit tests, the 3-minute bot test, and a client smoke test.
# Pushes to main then publish client builds as a Release. Railway deploys the server itself
# from main (railway.json watchPatterns: only when server files change).
#
# Worker branches are tested once, by their PR run (the required "Test" check). A push to a
# branch with no PR runs nothing, so a PR's commit is not tested twice.
#
# Docs-only changes (docs/, changelog.d/, *.md at the root) still run the unit tests, which
# lint the patch notes, but skip the bot tests and the client smoke test: nothing the game
# runs changed. Any other file runs everything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also redeploy the server to Railway with the CLI (needs RAILWAY_TOKEN)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.3-stable

jobs:
  test:
    name: Test (unit + bot test + client smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aimmo
          POSTGRES_PASSWORD: aimmo_ci_only
          POSTGRES_DB: aimmo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aimmo" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway CI database, not a secret.
      DATABASE_URL: postgres://aimmo:aimmo_ci_only@127.0.0.1:5432/aimmo_test
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: What changed (docs-only changes skip the slow tests)
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/changed_code.py

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Unit tests
        run: godot --headless --path game -s tests/unit/run_all.gd

      - name: Protocol-mismatch test (old clients are told to update, not left hanging)
        if: steps.changes.outputs.code == 'true'
        run: python3 tests/protocol/run_protocol_test.py --transport websocket

      - name: Watchdog test (a frozen server is restarted, a healthy one is left alone)
        if: steps.changes.outputs.code == 'true'
        run: python3 tests/ops/run_watchdog_test.py

      - name: Dockerfile checks (fast, no Docker)
        run: python3 -m unittest discover -s tests/ops -p 'test_*.py'

      - name: Build the server image (the same Dockerfile Railway builds)
        run: docker build -t aimmo-server:ci .

      - name: Server image test (contents, boot, 2 bots play, docker stop saves, watchdog restarts)
        run: python3 tests/ops/run_image_test.py --image aimmo-server:ci

      - name: Fun-metrics report tests
        if: steps.changes.outputs.code == 'true'
        run: python3 -m unittest discover -s tests/bot_test -p 'test_*.py'

      - name: Render-budget maths tests
        if: steps.changes.outputs.code == 'true'
        run: python3 -m unittest discover -s tests/client_smoke -p 'test_*.py'

      - name: Bot test (8 bots, 3 minutes, WebSocket, Postgres, fun metrics checked)
        if: steps.changes.outputs.code == 'true'
        run: python3 tests/bot_test/run_bot_test.py --bots 8 --duration 180 --transport websocket --fun-check

      - name: Bot test smoke (8 bots, 45 seconds, ENet)
        if: steps.changes.outputs.code == 'true'
        run: python3 tests/bot_test/run_bot_test.py --bots 8 --duration 45 --transport enet

      - name: Install virtual display for the client smoke test
        if: steps.changes.outputs.code == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/dev/null

      - name: Client smoke test (screenshots, action camera, render budget)
        if: steps.changes.outputs.code == 'true'
        timeout-minutes: 8
        run: tests/client_smoke/run.sh build/client-smoke

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            build/client-smoke/
            /tmp/aimmo-bot-test-*/
            /tmp/aimmo-protocol-test-*/
            /tmp/aimmo-watchdog-test-*/
            /tmp/aimmo-image-test-*/
          if-no-files-found: ignore
          retention-days: 14

  # Railway's GitHub autodeploy already deploys every server change on main, so deploying again
  # here restarted the server twice per merge (players were kicked twice). This job is now only
  # a manual redeploy: Actions -> CI -> Run workflow on main, with "deploy" ticked.
  deploy:
    name: Deploy server to Railway
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Railway is configured
        id: cfg
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not set, skipping deploy. See docs/devlog/week-00.md for setup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.cfg.outputs.skip != 'true'
        run: |
          npm install -g @railway/cli@4
          railway up --ci --service "${RAILWAY_SERVICE:-AiMMO-Server}"

  release:
    name: Build clients and publish release
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        if: needs.test.outputs.code == 'true'
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      - name: Read this week's changelog entry
        id: notes
        run: |
          python3 - <<'PY'
          import os, re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## Week (\d+) — (.+)$", text, re.M)
          if not m:
              raise SystemExit("CHANGELOG.md has no '## Week NN — Headline' entry")
          start = m.end()
          nxt = re.search(r"^## ", text[start:], re.M)
          body = text[start:start + nxt.start()] if nxt else text[start:]
          # Fragments the integrator hasn't folded into CHANGELOG.md yet still reach the notes,
          # so the integrator can fold a few times a day instead of after every merge.
          import glob
          pending = []
          for f in sorted(glob.glob("changelog.d/*.md")):
              if os.path.basename(f).lower() == "readme.md":
                  continue
              pending += [l.rstrip() for l in open(f, encoding="utf-8") if l.strip()]
          if pending:
              body = "\n".join(pending) + "\n" + body.strip()
          open("release-notes.md", "w", encoding="utf-8").write(body.strip() + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag=week-{m.group(1)}\n")
              out.write(f"title=Week {m.group(1)} — {m.group(2).strip()}\n")
          PY

      - name: Bake the public server address into the client
        if: needs.test.outputs.code == 'true'
        env:
          AIMMO_PUBLIC_SERVER: ${{ vars.AIMMO_PUBLIC_SERVER }}
        run: |
          if [ -n "$AIMMO_PUBLIC_SERVER" ]; then
            echo "$AIMMO_PUBLIC_SERVER" > game/client/default_server.txt
          else
            echo "::warning::AIMMO_PUBLIC_SERVER variable not set; clients will default to 127.0.0.1"
          fi

      - name: Bake the build number and update address into the client
        if: needs.test.outputs.code == 'true'
        # The installed game checks update.json on the latest release at startup and
        # downloads a newer game pack when this build number is behind (game/client/updater.gd).
        run: |
          echo "$GITHUB_RUN_NUMBER" > game/client/build_id.txt
          echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download" > game/client/update_url.txt

      - name: Export clients
        if: needs.test.outputs.code == 'true'
        run: |
          set -euo pipefail
          for p in client-linux client-windows client-macos; do
            mkdir -p "build/$p"
            godot --headless --path game --export-release "$p" 2>&1 | tee "build/$p.log"
            if grep -q "ERROR" "build/$p.log"; then echo "export $p failed"; exit 1; fi
          done
          mkdir -p dist
          (cd build/client-linux && zip -q -r ../../dist/AiMMO-linux.zip .)
          (cd build/client-windows && zip -q -r ../../dist/AiMMO-windows.zip .)
          cp build/client-macos/AiMMO.zip dist/AiMMO-macos.zip
          # Self-update packs: the whole game minus the engine, one per platform.
          for os in linux windows macos; do
            godot --headless --path game --export-pack "client-$os" "$PWD/dist/AiMMO-$os.pck" 2>&1 | tee "build/pack-$os.log"
            if grep -q "ERROR" "build/pack-$os.log" || [ ! -s "dist/AiMMO-$os.pck" ]; then echo "pack $os failed"; exit 1; fi
          done
          mkdir -p manifest
          python3 - <<'PY'
          import hashlib, json, os
          files = {}
          for o in ("linux", "windows", "macos"):
              name = f"AiMMO-{o}.pck"
              data = open(f"dist/{name}", "rb").read()
              files[o] = {"name": name, "size": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          manifest = {"build": int(os.environ["GITHUB_RUN_NUMBER"]), "engine": os.environ["GODOT_VERSION"], "files": files}
          json.dump(manifest, open("manifest/update.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          CODE: ${{ needs.test.outputs.code }}
        run: |
          if [ "$CODE" != "true" ]; then
            # Docs or patch notes only: refresh the notes, keep the builds (installed games
            # would otherwise download an identical update).
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            fi
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A fix pushed later in the same week updates that week's release.
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TITLE" --notes-file release-notes.md --target "$GITHUB_SHA" --latest
          fi
          # update.json goes up last, so installed games only see a build once its packs are there.
          gh release upload "$TAG" manifest/update.json --clobber
